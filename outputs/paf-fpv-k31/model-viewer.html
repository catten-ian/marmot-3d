<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PAF k3.1 model review</title>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
<style>body{margin:0;background:#73868c;overflow:hidden}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { createPafFoxModel } from '/src/entities/paf-fox-model.js';
import { createPafMoleModel } from '/src/entities/paf-mole-model.js';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#81969c');
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
scene.add(new THREE.HemisphereLight(0xd8e8ef, 0x46503b, 1.35));
const sun = new THREE.DirectionalLight(0xffecd2, 2.4);
sun.position.set(4, 7, 5);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: '#657853', roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const fox = createPafFoxModel({});
fox.group.position.set(-0.72, 0, 0);
scene.add(fox.group);
const mole = createPafMoleModel({});
mole.position.set(0.78, 0, 0.08);
scene.add(mole);
let foxAnim = 'idle', foxSpeed = 0, moleState = 'wander';
let camYaw = 0.30, camPitch = 0.16, camDist = 2.65;
window.__set = (o = {}) => {
  if (o.foxAnim) foxAnim = o.foxAnim;
  if (Number.isFinite(o.foxSpeed)) foxSpeed = o.foxSpeed;
  if (o.moleState) moleState = o.moleState;
  if (Number.isFinite(o.camYaw)) camYaw = o.camYaw;
  if (Number.isFinite(o.camPitch)) camPitch = o.camPitch;
  if (Number.isFinite(o.camDist)) camDist = o.camDist;
  return { foxAnim, foxSpeed, moleState, camYaw, camPitch, camDist };
};
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  fox.setAnimState({ anim: foxAnim, speed: foxSpeed });
  fox.update(dt);
  mole.setMoleState(moleState);
  mole.updateAnim(dt, 0);
  camera.position.set(Math.sin(camYaw) * Math.cos(camPitch) * camDist,
    0.58 + Math.sin(camPitch) * camDist, Math.cos(camYaw) * Math.cos(camPitch) * camDist);
  camera.lookAt(0, 0.43, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
window.__ready = true;
</script></body></html>
